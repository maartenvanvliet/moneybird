name: Ruby

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby_version: ["3.3", "3.4", "4.0"]

    steps:
    - uses: actions/checkout@v3.3.0

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true

    - name: Build and test with Rake
      env:
        CI: true
      run: |
        bundle exec rake
